name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_python.py
      - run: python -m unittest discover -s tests -v
      - run: bash -n farcaster_cleanup_all.sh && bash -n archive_viewer/launch.command
      - run: node --check archive_viewer/app.js
      - if: runner.os == 'Linux'
        run: shellcheck farcaster_cleanup_all.sh archive_viewer/launch.command
