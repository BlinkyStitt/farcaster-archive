name: Checks
on:
  push:
  pull_request:
concurrency:
  group: pr-ci-checks.yml-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch && github.ref) || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ski-kvm-farcaster-archive' || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_python.py
      - run: python -m unittest discover -s tests -v
      - run: bash -n farcaster_cleanup_all.sh && bash -n archive_viewer/launch.command
      - run: node --check archive_viewer/app.js
      - if: runner.os == 'Linux'
        run: shellcheck farcaster_cleanup_all.sh archive_viewer/launch.command
